name: Deploy docs

# The site is published as several complete builds under one Pages root:
#
#   /TMDataGrid/              the newest release, or the newest line there is
#   /TMDataGrid/next/         the tip of main
#   /TMDataGrid/v2.0/         one directory per minor line
#   /TMDataGrid/b/<branch>/   previews, while a pull request is labelled
#   /TMDataGrid/versions.json the manifest the header's version menu reads
#
# The gh-pages branch is the store: a run writes its directories there and then
# deploys the whole branch as the Pages artifact. Keeping the artifact flow
# means no repository setting has to change and every deploy stays visible in
# the Environments tab, while the branch is what makes several versions live at
# once.
#
# A versioned snapshot hangs off the push to main rather than off a tag, because
# Changesets creates tags with GITHUB_TOKEN and events raised by that token do
# not start workflow runs. See scripts/docs-plan.mjs for the rules.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build. Empty builds the default branch."
        required: false
        default: ""
      slug:
        description: 'Directory to publish into: "root", "next", "v1.1", "b/name".'
        required: true
      mirror_root:
        description: "Also serve this build from the site root."
        type: boolean
        default: false

permissions:
  contents: write # commit the built site to gh-pages
  pages: write
  id-token: write
  pull-requests: write # the preview link comment

# Every run writes the same branch and deploys the same site, so they queue
# rather than overlap. Not cancel-in-progress: a run stopped between the push
# and the upload would leave the branch ahead of what is being served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Previews are opt in, and a fork's pull request has no token to push with.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'docs-preview') ||
        github.event.action == 'unlabeled' ||
        github.event.action == 'closed'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_ROOT: /TMDataGrid/
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so a catch-up snapshot can be built from the exact release
          # commit rather than from whatever main has moved on to.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check out the branch that stores the site
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site
            git -C site init -q -b gh-pages
            git -C site remote add origin "$REMOTE"
          fi
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide what to publish
        id: plan
        env:
          DOCS_INPUT_REF: ${{ inputs.ref }}
          DOCS_INPUT_SLUG: ${{ inputs.slug }}
          DOCS_INPUT_MIRROR_ROOT: ${{ inputs.mirror_root }}
        run: |
          set -euo pipefail
          plan=$(node scripts/docs-targets.mjs site)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "work=$(jq -r .work <<<"$plan")" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.work == 'true'
        run: npm ci

      - name: Build and stage every target
        if: steps.plan.outputs.work == 'true'
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail

          # A snapshot may be built from a ref that predates these files, and
          # checking that ref out replaces the working tree, so the deploy's own
          # tooling is put out of reach of the checkout first.
          tools="$RUNNER_TEMP/docs-deploy"
          mkdir -p "$tools"
          cp -a scripts/. "$tools/"
          cp public/docs-spa-path.js public/docs-version-switcher.js "$tools/"

          head_sha=$(git rev-parse HEAD)
          current=""

          build() {
            local slug="$1" ref="$2" label="$3" version="$4" kind="$5"
            local base="$SITE_ROOT"
            if [ "$slug" != "root" ]; then base="$SITE_ROOT$slug/"; fi

            VITE_DOCS_SITE_ROOT="$SITE_ROOT" VITE_DOCS_SLUG="$slug" \
              npm run build -- --base="$base"

            # Pages answers every missing path with the site root's 404,
            # whatever directory the path was under: a copy's own is never
            # consulted. The root's therefore carries the redirect that sends a
            # version's deep link into that version, and every copy builds one
            # because the root is a mirror of one of them.
            cp dist-demo/index.html dist-demo/404.html

            # In the head, and synchronous: module scripts are deferred, so this
            # settles the URL before the router first reads it.
            head_tag="<script src=\"${SITE_ROOT}docs-spa-path.js\" data-site-root=\"$SITE_ROOT\" data-slug=\"$slug\"></script>"
            sed -i "s#<head>#<head>$head_tag#" dist-demo/index.html dist-demo/404.html

            jq -n --arg slug "$slug" --arg label "$label" \
              --arg version "$version" --arg kind "$kind" \
              '{slug:$slug,label:$label,version:$version,kind:$kind}' \
              > dist-demo/meta.json

            # Only for a build whose own header cannot switch versions.
            if ! git cat-file -e "$ref:src/docsVersions.ts" 2>/dev/null; then
              local tag="<script src=\"${SITE_ROOT}docs-version-switcher.js\" data-site-root=\"$SITE_ROOT\" data-slug=\"$slug\" defer></script>"
              sed -i "s#</body>#$tag</body>#" dist-demo/index.html dist-demo/404.html
            fi
          }

          for i in $(seq 0 $(($(jq '.targets | length' <<<"$PLAN") - 1))); do
            target=$(jq -c ".targets[$i]" <<<"$PLAN")
            slug=$(jq -r .slug <<<"$target")
            ref=$(jq -r .ref <<<"$target")
            label=$(jq -r '.label // ""' <<<"$target")
            version=$(jq -r '.version // ""' <<<"$target")
            kind=$(jq -r .kind <<<"$target")
            mirror=$(jq -r .mirrorRoot <<<"$target")

            if [ "$ref" != "$current" ]; then
              git checkout --force "${ref:-$head_sha}"
              npm ci
              current="$ref"
            fi
            sha="${ref:-$head_sha}"

            build "$slug" "$sha" "$label" "$version" "$kind"
            rm -rf "site/$slug"
            mkdir -p "site/$slug"
            cp -a dist-demo/. "site/$slug/"

            if [ "$mirror" = "true" ]; then
              build root "$sha" "$label" "$version" "$kind"
              # Replace the root copy's own files and leave every versioned
              # directory beside it alone.
              find site -maxdepth 1 -type f -delete
              rm -rf site/assets
              cp -a dist-demo/. site/
              # The root is a mirror, not a copy of its own: the manifest marks
              # the entry it serves rather than listing the root twice.
              jq -n --arg slug "$slug" '{slug:$slug}' > site/meta.json
            fi
          done

          for gone in $(jq -r '.remove[]' <<<"$PLAN"); do
            rm -rf "site/$gone"
          done
          rmdir site/b 2>/dev/null || true

          cp "$tools/docs-spa-path.js" "$tools/docs-version-switcher.js" site/
          node "$tools/docs-manifest.mjs" site

      - name: Commit the site
        if: steps.plan.outputs.work == 'true'
        run: |
          set -euo pipefail
          cd site
          git add -A
          if git diff --quiet --cached; then
            echo "The published site is already up to date."
            exit 0
          fi
          git commit -q -m "docs: publish ${GITHUB_SHA:0:7}"
          for attempt in 1 2 3 4; do
            if git push -u origin gh-pages; then exit 0; fi
            sleep $((attempt * 2))
            git pull --rebase origin gh-pages
          done
          echo "Could not push gh-pages."
          exit 1

      - name: Stage the artifact
        if: steps.plan.outputs.work == 'true'
        # The branch's history is not part of the site.
        run: rm -rf site/.git

      - if: steps.plan.outputs.work == 'true'
        uses: actions/configure-pages@v5

      - if: steps.plan.outputs.work == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        if: steps.plan.outputs.work == 'true'
        uses: actions/deploy-pages@v4

      - name: Link the preview from the pull request
        if: >-
          steps.plan.outputs.work == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        with:
          script: |
            const plan = JSON.parse(process.env.PLAN);
            const preview = plan.targets.find((t) => t.kind === "preview");
            if (!preview) return;

            const marker = "<!-- docs-preview -->";
            const url = `${{ steps.deployment.outputs.page_url }}${preview.slug}/`;
            const body = `${marker}\nDocs preview for this branch: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body?.startsWith(marker));

            // One comment kept current, rather than one per push.
            if (mine) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
