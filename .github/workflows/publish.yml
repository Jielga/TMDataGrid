name: Publish

# Releases are cut by pushing a version tag, which `npm version` creates:
#
#   npm version patch      # or minor / major — commits and tags v0.0.2
#   git push --follow-tags
#
# Nothing publishes on a normal push to main, so merging is always safe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit. Fail before anything reaches the registry.
      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing $PKG"

      - run: npm run lint

      - run: npx tsc -b

      # `prepublishOnly` runs lint and build:lib, so dist is always rebuilt
      # from this commit rather than whatever happened to be on disk.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
