name: Release

# Changesets owns versions; this workflow owns the publish. Pushing to main
# opens (or updates) a "Version Packages" PR that bumps package.json, writes
# CHANGELOG.md and syncs the skills' library_version. Merging that PR is what
# releases, and the merge is itself just another push to main.
#
# Every push publishes whatever main's package.json says, if and only if the
# registry does not already have that version, which holds however the merges
# are ordered.
on:
  push:
    branches: [main]

# A second run while the first is mid-publish would race on the version PR
# branch and on the registry.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # commit the version PR, push tags, create releases
  pull-requests: write # open and update the version PR
  id-token: write # npm trusted publishing (auth) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changelog-github links each entry back to its commit, so it needs
          # more than the default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc -b

      # A release is not worth making from a red suite, and CI's own run does
      # not gate this workflow.
      - run: npm run test

      # Publishing is this step's job rather than the action's below.
      #
      # changesets/action is a single switch: when any changeset on main is
      # still unconsumed it runs `version` and returns, and never reaches its
      # publish script. A version pull request merged after a feature pull
      # request has landed leaves one, so the version that pull request was
      # merged to release is versioned, tagged in package.json - and never
      # published, with the job green. 2.0.0-beta.6 was lost that way.
      #
      # It also has to run before the action, not after: the action's version
      # step switches the checkout to the changeset-release branch, so by the
      # time it returns package.json holds the *next* version.
      #
      # `changeset publish` skips what the registry already has, and the check
      # below says so in the log rather than leaving it to be inferred, so an
      # ordinary push is a no-op. `prepublishOnly` rebuilds dist from this
      # commit, so a stale build cannot reach the registry.
      #
      # There is no npm token: the registry authenticates this job through
      # trusted publishing, configured package-side on npmjs.com against this
      # repo and this workflow filename. Renaming this file breaks publishing,
      # and a broken config surfaces as a misleading `E404 ... PUT` on publish.
      - name: Publish what the registry does not have
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; nothing to publish."
            exit 0
          fi

          npm run release
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The action does this for the releases it publishes; these are ours.
      #
      # Idempotent throughout. The publish above has already happened by the
      # time this runs, so a tag or a release that is somehow already there is
      # not a reason to fail the job and send someone looking for a release
      # that did reach the registry.
      - name: Tag the published version and write its release
        if: steps.publish.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release."
            exit 0
          fi

          notes="$RUNNER_TEMP/notes.md"
          if ! node scripts/changelog-entry.mjs "$VERSION" > "$notes"; then
            echo "::warning::No changelog section for $VERSION; releasing without notes."
            echo "$tag" > "$notes"
          fi

          # Marked a prerelease on the same rule the action uses: a version
          # with a hyphen in it.
          set -- gh release create "$tag" --title "$tag" --notes-file "$notes"
          case "$VERSION" in *-*) set -- "$@" --prerelease ;; esac
          "$@"

      # `publish` is set but does not publish. The step above has already
      # published anything missing, and the input has to be non-empty or the
      # version pull request's body says the packages must be published by
      # hand, which is not true of this repository.
      #
      # It cannot be `npm run release`: `changeset publish` asks the registry
      # whether the version exists, and seconds after the publish above the
      # registry can still say no, so it published again and npm refused the
      # duplicate with a 409. 2.0.0-beta.8 failed that way, with the release
      # already on the registry.
      - uses: changesets/action@v1.9.0
        with:
          version: npm run version-packages
          publish: echo published by the step above
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
